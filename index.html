<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAAWOW EMS - Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0A2342, #0D47A1);
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
    }

    .logo h1 {
      margin: 0;
      color: #0D47A1;
      font-size: 28px;
    }

    .logo p {
      margin: 6px 0 25px;
      color: #666;
      font-size: 14px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #0A2342;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #0D47A1;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #0D47A1;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block !important;
      background: #e8f5e9;
      color: #1b5e20;
    }

    .error {
      display: block !important;
      background: #ffebee;
      color: #b71c1c;
    }

    .info {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      <h1>GAAWOW EMS</h1>
      <p>Ilayska Aqoonta iyo Xirfadda</p>
    </div>

    <h2>Super Admin Login</h2>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        value="gaawow12@hotmail.com"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

    </form>

    <div id="message"></div>

    <div class="info">
      GAAWOW Academy • EMS V1.0
    </div>

  </div>

<script>
  // ============================================================
  // GAAWOW EMS — SUPABASE CONFIGURATION
  // ============================================================

  const SUPABASE_URL =
    "https://mujmcunlmkvtbjslaely.supabase.co";

  // PASTE YOUR SUPABASE PUBLISHABLE KEY INSIDE THE QUOTES
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_0p_FEoWpmKo7g1uZNx4dzQ_6MKm80ef";


  // ============================================================
  // CREATE SUPABASE CLIENT
  // ============================================================

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // ============================================================
  // LOGIN
  // ============================================================

  const form = document.getElementById("loginForm");
  const button = document.getElementById("loginButton");
  const message = document.getElementById("message");

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.className = "";
    message.style.display = "none";
    message.textContent = "";

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Logging in...";

    try {

      // ----------------------------------------------------------
      // 1. SUPABASE AUTH LOGIN
      // ----------------------------------------------------------

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        throw new Error(error.message);
      }

      if (!data.user) {
        throw new Error("Login failed: user not found.");
      }


      // ----------------------------------------------------------
      // 2. GET PROFILE
      // ----------------------------------------------------------

      const { data: profile, error: profileError } =
        await supabaseClient
          .from("profiles")
          .select("id, full_name, role, is_active")
          .eq("id", data.user.id)
          .single();

      if (profileError) {
        throw new Error(
          "Login succeeded, but profile could not be loaded: " +
          profileError.message
        );
      }


      // ----------------------------------------------------------
      // 3. CHECK ACTIVE ACCOUNT
      // ----------------------------------------------------------

      if (!profile.is_active) {

        await supabaseClient.auth.signOut();

        throw new Error(
          "This account is inactive."
        );
      }


      // ----------------------------------------------------------
      // 4. CHECK SUPER ADMIN ROLE
      // ----------------------------------------------------------

      if (profile.role !== "super_admin") {

        await supabaseClient.auth.signOut();

        throw new Error(
          "Access denied. Super Admin role is required."
        );
      }


      // ----------------------------------------------------------
      // 5. SUCCESS
      // ----------------------------------------------------------

      message.className = "success";

      message.innerHTML = `
        <strong>LOGIN SUCCESSFUL ✓</strong><br><br>
        Name: ${escapeHtml(profile.full_name)}<br>
        Email: ${escapeHtml(data.user.email)}<br>
        Role: ${escapeHtml(profile.role)}<br>
        Active: ${profile.is_active ? "true" : "false"}
      `;


    } catch (error) {

      console.error(error);

      let errorText = error.message || "Unknown error.";

      if (
        errorText.toLowerCase().includes("invalid api key")
      ) {
        errorText =
          "Invalid API key. Please check that the Supabase Publishable Key in index.html is correct.";
      }

      message.className = "error";
      message.textContent = "ERROR: " + errorText;

    } finally {

      button.disabled = false;
      button.textContent = "Login";

    }

  });


  // ============================================================
  // SECURITY — BASIC HTML ESCAPE
  // ============================================================

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
