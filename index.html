<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GAAWOW EMS — Admin Login</title>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background:
        linear-gradient(
          135deg,
          #0A2342 0%,
          #0D47A1 55%,
          #123B72 100%
        );
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: #ffffff;
      border-radius: 22px;
      padding: 32px 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    .logo {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0D47A1;
      color: #F4B400;
      font-size: 25px;
      font-weight: 800;
      border: 4px solid #F4B400;
    }

    h1 {
      text-align: center;
      color: #0A2342;
      font-size: 25px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      color: #0A2342;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid #d6dbe2;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      margin-bottom: 17px;
    }

    input:focus {
      border-color: #0D47A1;
      box-shadow: 0 0 0 3px rgba(13,71,161,0.10);
    }

    button {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 10px;
      background: #0D47A1;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #0A367D;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      margin-top: 18px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      display: block;
      background: #fdecec;
      color: #a61b1b;
      border: 1px solid #f5b5b5;
    }

    .success {
      display: block;
      background: #eaf8ef;
      color: #146c35;
      border: 1px solid #b9e3c6;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #f5f7fa;
      font-size: 12px;
      line-height: 1.5;
      color: #444;
      word-break: break-word;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 22px;
    }

    .hidden {
      display: none !important;
    }

    .dashboard {
      text-align: center;
    }

    .dashboard-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    .dashboard h2 {
      color: #0A2342;
      margin-bottom: 10px;
    }

    .dashboard p {
      color: #555;
      margin-bottom: 8px;
    }

    .logout {
      margin-top: 20px;
      background: #C0392B;
    }

    .logout:hover {
      background: #992D22;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN CARD -->
  <div class="card" id="loginCard">

    <div class="logo">
      GA
    </div>

    <h1>GAAWOW EMS</h1>

    <div class="subtitle">
      Education Management System
    </div>

    <form id="loginForm">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        autocomplete="email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        Sign In
      </button>

    </form>

    <div
      id="message"
      class="message"
    ></div>

    <div class="status">
      <strong>System:</strong>
      <span id="connectionStatus">
        Checking Supabase connection...
      </span>
    </div>

    <div class="footer">
      GAAWOW Academy © 2026
    </div>

  </div>


  <!-- DASHBOARD CARD -->
  <div
    class="card dashboard hidden"
    id="dashboardCard"
  >

    <div class="dashboard-icon">
      ✅
    </div>

    <h2>
      Login Successful
    </h2>

    <p>
      Welcome to GAAWOW EMS
    </p>

    <p>
      <strong id="userEmail"></strong>
    </p>

    <p id="userRole">
      Checking role...
    </p>

    <button
      class="logout"
      id="logoutButton"
    >
      Logout
    </button>

  </div>

</div>


<script>

  /* =====================================================
     GAAWOW EMS — SUPABASE CONFIGURATION
     ===================================================== */

  const SUPABASE_URL =
    "https://mujmcunlmkvtbjslaely.supabase.co";

  /*
    IMPORTANT:
    Replace ONLY the value below with your
    Supabase PUBLISHABLE KEY.

    DO NOT use:
    sb_secret_...

    Use:
    sb_publishable_...
  */

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_0p_FEoWpmKo7g1uZNx4dzQ_6MKm80ef";


  /* =====================================================
     CREATE SUPABASE CLIENT
     ===================================================== */

  let supabaseClient = null;

  const message =
    document.getElementById("message");

  const connectionStatus =
    document.getElementById("connectionStatus");

  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const loginCard =
    document.getElementById("loginCard");

  const dashboardCard =
    document.getElementById("dashboardCard");

  const userEmail =
    document.getElementById("userEmail");

  const userRole =
    document.getElementById("userRole");

  const logoutButton =
    document.getElementById("logoutButton");


  /* =====================================================
     MESSAGE FUNCTION
     ===================================================== */

  function showMessage(text, type = "error") {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  function clearMessage() {

    message.textContent = "";

    message.className =
      "message";

  }


  /* =====================================================
     VALIDATE CONFIGURATION
     ===================================================== */

  function validateConfiguration() {

    if (!SUPABASE_URL) {

      connectionStatus.textContent =
        "Supabase URL is missing.";

      return false;
    }

    if (
      !SUPABASE_PUBLISHABLE_KEY ||
      SUPABASE_PUBLISHABLE_KEY ===
      "PASTE_YOUR_PUBLISHABLE_KEY_HERE"
    ) {

      connectionStatus.textContent =
        "Publishable Key has not been added.";

      showMessage(
        "Supabase Publishable Key-ka wali lama gelin index.html."
      );

      return false;
    }


    /*
      Check that this is the new publishable key format.
    */

    if (
      !SUPABASE_PUBLISHABLE_KEY.startsWith(
        "sb_publishable_"
      )
    ) {

      connectionStatus.textContent =
        "Invalid key format.";

      showMessage(
        "Key-ga waa inuu ku bilaabmaa sb_publishable_."
      );

      return false;
    }

    return true;
  }


  /* =====================================================
     INITIALIZE SUPABASE
     ===================================================== */

  function initializeSupabase() {

    if (!validateConfiguration()) {
      return false;
    }

    try {

      supabaseClient =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY
        );

      connectionStatus.textContent =
        "Supabase client initialized.";

      return true;

    } catch (error) {

      console.error(error);

      connectionStatus.textContent =
        "Supabase initialization failed.";

      showMessage(
        "Supabase lama bilaabi karin. Hubi Publishable Key-ga."
      );

      return false;
    }
  }


  /* =====================================================
     TEST SUPABASE CONNECTION
     ===================================================== */

  async function testConnection() {

    if (!supabaseClient) {
      return;
    }

    try {

      const {
        data,
        error
      } =
      await supabaseClient
        .from("academy_profile")
        .select("*")
        .limit(1);


      if (error) {

        console.error(
          "Supabase connection error:",
          error
        );

        /*
          If table/RLS prevents reading,
          the key may still be valid.
        */

        if (
          error.message &&
          error.message.toLowerCase()
            .includes("invalid api key")
        ) {

          connectionStatus.textContent =
            "INVALID API KEY";

          showMessage(
            "Invalid API key. Hubi in Publishable Key-ga uu ka yimid project-kan Supabase."
          );

        } else {

          connectionStatus.textContent =
            "Supabase connected.";

        }

        return;
      }


      connectionStatus.textContent =
        "Supabase connected successfully.";

    } catch (error) {

      console.error(error);

      connectionStatus.textContent =
        "Connection test failed.";

    }
  }


  /* =====================================================
     CHECK EXISTING SESSION
     ===================================================== */

  async function checkSession() {

    if (!supabaseClient) {
      return;
    }

    try {

      const {
        data,
        error
      } =
      await supabaseClient.auth.getSession();


      if (error) {

        console.error(error);

        return;
      }


      if (
        data &&
        data.session &&
        data.session.user
      ) {

        await loadUserDashboard(
          data.session.user
        );

      }

    } catch (error) {

      console.error(
        "Session error:",
        error
      );

    }
  }


  /* =====================================================
     LOGIN
     ===================================================== */

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      clearMessage();

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;


      if (!email || !password) {

        showMessage(
          "Email iyo password geli."
        );

        return;
      }


      loginButton.disabled = true;

      loginButton.textContent =
        "Signing in...";


      try {

        const {
          data,
          error
        } =
        await supabaseClient.auth
          .signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          console.error(
            "Login error:",
            error
          );

          showMessage(
            error.message ||
            "Login failed."
          );

          loginButton.disabled = false;

          loginButton.textContent =
            "Sign In";

          return;
        }


        if (
          data &&
          data.user
        ) {

          showMessage(
            "Login successful.",
            "success"
          );

          await loadUserDashboard(
            data.user
          );

        }

      } catch (error) {

        console.error(error);

        showMessage(
          "Login failed. Fadlan mar kale isku day."
        );

      }


      loginButton.disabled = false;

      loginButton.textContent =
        "Sign In";

    }
  );


  /* =====================================================
     LOAD USER PROFILE / ROLE
     ===================================================== */

  async function loadUserDashboard(user) {

    if (!user) {
      return;
    }


    userEmail.textContent =
      user.email || "";


    try {

      const {
        data: profile,
        error
      } =
      await supabaseClient
        .from("profiles")
        .select(
          "full_name, role, is_active"
        )
        .eq("id", user.id)
        .single();


      if (error) {

        console.error(
          "Profile error:",
          error
        );

        userRole.textContent =
          "Profile lama helin.";

      } else {

        userRole.innerHTML =
          "<strong>Name:</strong> " +
          (profile.full_name || "N/A") +
          "<br>" +
          "<strong>Role:</strong> " +
          (profile.role || "N/A") +
          "<br>" +
          "<strong>Active:</strong> " +
          (profile.is_active ? "Yes" : "No");


        if (!profile.is_active) {

          await supabaseClient.auth.signOut();

          showMessage(
            "Account-kan waa inactive."
          );

          return;
        }


        /*
          For the first Super Admin test,
          allow the dashboard.
        */

        if (
          profile.role !==
          "super_admin"
        ) {

          showMessage(
            "Account-kan ma laha Super Admin role."
          );

          return;
        }

      }


      loginCard.classList.add(
        "hidden"
      );

      dashboardCard.classList.remove(
        "hidden"
      );


    } catch (error) {

      console.error(error);

      showMessage(
        "Profile-ka lama akhrin karin."
      );

    }
  }


  /* =====================================================
     LOGOUT
     ===================================================== */

  logoutButton.addEventListener(
    "click",
    async function() {

      try {

        const {
          error
        } =
        await supabaseClient.auth
          .signOut();


        if (error) {

          console.error(error);

          showMessage(
            "Logout failed."
          );

          return;
        }


        dashboardCard.classList.add(
          "hidden"
        );

        loginCard.classList.remove(
          "hidden"
        );

        document
          .getElementById("password")
          .value = "";

        clearMessage();

      } catch (error) {

        console.error(error);

      }

    }
  );


  /* =====================================================
     START SYSTEM
     ===================================================== */

  async function startSystem() {

    const initialized =
      initializeSupabase();


    if (!initialized) {
      return;
    }


    await testConnection();

    await checkSession();

  }


  startSystem();

</script>

</body>
</html>
