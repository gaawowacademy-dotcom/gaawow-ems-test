










<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAAWOW EMS - Login Test</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
box-sizing: border-box;
font-family: Arial, sans-serif;
}

body {
margin: 0;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
background: #0A2342;
padding: 20px;
}

.box {
width: 100%;
max-width: 400px;
background: white;
padding: 30px;
border-radius: 18px;
box-shadow: 0 15px 40px rgba(0,0,0,.25);
}

h1 {
text-align: center;
color: #0B4DA2;
margin-bottom: 5px;
}

.subtitle {
text-align: center;
color: #666;
margin-bottom: 25px;
}

label {
display: block;
margin: 15px 0 7px;
font-weight: bold;
}

input {
width: 100%;
padding: 13px;
border: 1px solid #ccc;
border-radius: 8px;
font-size: 16px;
}

button {
width: 100%;
margin-top: 22px;
padding: 14px;
border: 0;
border-radius: 8px;
background: #0B4DA2;
color: white;
font-size: 16px;
font-weight: bold;
}

#result {
margin-top: 20px;
padding: 15px;
border-radius: 8px;
display: none;
line-height: 1.6;
}

.success {
display: block !important;
background: #e8f7ee;
color: #176b3a;
}

.error {
display: block !important;
background: #fdecec;
color: #a32121;
}

.role {
font-weight: bold;
color: #0B4DA2;
}
</style>
</head>

<body>

<div class="box">

<h1>GAAWOW EMS</h1>

<div class="subtitle">
Supabase Login Test
</div>

<form id="loginForm">

<label>Email</label>

<input
type="email"
id="email"
value="gaawow12@hotmail.com"
required
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter password"
required
>

<button type="submit" id="loginBtn">
Login
</button>

</form>

<div id="result"></div>

</div>

<script>

const SUPABASE_URL =
"https://mujmcunlmkvtbjslaely.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpleWdsd3plamN5dnByaGpwd212Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MDY4NzcsImV4cCI6MjEwNDM4Mjg3N30.UKWwaEOaxRKJgvrJ3quoA2gMhbSEL_4jGiTP-9nZNZY";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


document
.getElementById("loginForm")
.addEventListener("submit", async function(e) {

e.preventDefault();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const button =
document.getElementById("loginBtn");

const result =
document.getElementById("result");

button.disabled = true;
button.textContent = "Logging in...";

result.className = "";
result.style.display = "none";

try {

const { data: authData, error: authError } =
await supabaseClient.auth.signInWithPassword({
email: email,
password: password
});

if (authError) {
throw new Error(authError.message);
}

const { data: profile, error: profileError } =
await supabaseClient
.from("profiles")
.select("id, full_name, role, is_active")
.eq("id", authData.user.id)
.single();

if (profileError) {
throw new Error(
"Profile error: " + profileError.message
);
}

if (!profile.is_active) {

await supabaseClient.auth.signOut();

throw new Error(
"Account-kan waa disabled."
);
}

if (profile.role !== "super_admin") {

await supabaseClient.auth.signOut();

throw new Error(
"Role-ku ma aha super_admin. Role: " +
profile.role
);
}

result.className = "success";

result.innerHTML =
"<strong>✅ LOGIN SUCCESSFUL</strong><br><br>" +
"<strong>Name:</strong> " +
profile.full_name +
"<br>" +
"<strong>Email:</strong> " +
authData.user.email +
"<br>" +
"<strong>Role:</strong> " +
"<span class='role'>" +
profile.role +
"</span><br>" +
"<strong>Active:</strong> " +
profile.is_active +
"<br><br>" +
"🎉 Supabase Auth + Super Admin waa shaqeynayaan.";

} catch (error) {

result.className = "error";

result.textContent =
"❌ " + error.message;

} finally {

button.disabled = false;
button.textContent = "Login";

}

});

</script>

</body>
</html>
